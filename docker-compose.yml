# Deployed as-is by Coolify (Docker Compose build pack).
# Host ports for local use live in docker-compose.override.yml.
services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      # SERVICE_NAME_DB is set by Coolify; in PR previews the service is renamed db-pr-N.
      - DATABASE_URL=postgres://todo:todo@${SERVICE_NAME_DB:-db}:5432/todo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=todo
    volumes:
      - todo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  todo-pg:
